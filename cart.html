<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart | MOLD MASTER</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"></head><body><div class="announcement">🚚 Fast Delivery All Over Pakistan | Easy Ordering on WhatsApp</div><header class="header"><div class="container nav"><a class="logo" href="index.html"><span>MOLD</span> MASTER<small>Baking Tools & Accessories</small></a><nav><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav></div></header><main><section class="section"><div class="container"><p class="eyebrow">YOUR SELECTION</p><h1 style="font-family:'Playfair Display';font-size:60px;margin:0 0 30px">Shopping cart.</h1><div id="cart"></div></div></section></main><footer><div class="container copyright">© 2026 MOLD MASTER · WhatsApp 0333 8487486</div></footer><script src="assets/js/main.js"></script><script>function renderCart(){const el=document.getElementById('cart'),cart=JSON.parse(localStorage.getItem('moldMasterCart')||'[]');if(!cart.length){el.innerHTML='<div style="padding:50px 0;border-top:1px solid var(--line)"><h2 style="font-family:\'Playfair Display\'">Your cart is empty.</h2><a class="btn btn-dark" href="shop.html">Continue Shopping →</a></div>';return}let total=cart.reduce((s,x)=>s+x.price*x.qty,0);el.innerHTML=cart.map(x=>`<div style="display:flex;gap:20px;align-items:center;border-top:1px solid var(--line);padding:20px 0"><div style="width:80px;height:80px;background:var(--cream);display:grid;place-items:center;font-size:28px">${x.icon}</div><div style="flex:1"><b>${x.name}</b><p style="margin:3px 0;color:var(--muted);font-size:12px">${money(x.price)} × ${x.qty}</p></div><button class="mini-btn" onclick="removeItem(${x.id})">Remove</button></div>`).join('')+`<div style="border-top:1px solid var(--ink);padding:25px 0;text-align:right"><h2 style="font-family:'Playfair Display'">Total: ${money(total)}</h2><a class="btn btn-dark" target="_blank" href="${waLink(cart,total)}">Order on WhatsApp →</a></div>`}function removeItem(id){let c=JSON.parse(localStorage.getItem('moldMasterCart')||'[]').filter(x=>x.id!==id);localStorage.setItem('moldMasterCart',JSON.stringify(c));renderCart();updateCartCount()}function waLink(cart,total){let text='Hello Mold Master, I want to order:%0A'+cart.map(x=>`${x.name} x${x.qty} = ${money(x.price*x.qty)}`).join('%0A')+`%0ATotal: ${money(total)}%0A%0AName:%0ACity:%0AAddress:`;return 'https://wa.me/923338748486?text='+text}renderCart();</script></body></html>
